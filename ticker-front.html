<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Live Ticker Stripe</title>
    <!-- Local copies (vendor/) so the overlay works without internet -->
    <script src="vendor/socket.io.min.js"></script>
    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --text-main: #ffffff;
            --up-color: #00ff88;
            --down-color: #ff4444;
            --accent: #3b82f6;
            --stripe-height: 75px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: var(--stripe-height);
            display: flex;
        }

        /* --- Time Section (Fixed Left) --- */
        #time-section {
            width: 380px;
            height: 100%;
            background: #000;
            border-right: 3px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 2rem;
            z-index: 100;
            flex-shrink: 0;
            box-shadow: 10px 0 20px rgba(0,0,0,0.8);
        }

        .time-label {
            font-size: 0.85rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-right: 1.5rem;
            white-space: nowrap;
            text-align: right;
            border-right: 1px solid #333;
            padding-right: 1.5rem;
            height: 60%;
            display: flex;
            align-items: center;
        }

        .time-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            width: 160px;
        }

        .time-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.6rem;
            line-height: 0.9;
            text-align: right;
        }

        .date-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.28rem;
            color: #888;
            text-align: right;
            margin-top: 0;
            line-height: 0.9;
            letter-spacing: 0;
        }

        /* --- Ticker Section (Scrolling) --- */
        #ticker-container {
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
            background: #0a0a0a;
            position: relative;
        }

        .ticker-track {
            display: flex;
            white-space: nowrap;
            will-change: transform;
            animation: scroll 40s linear infinite;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .asset {
            display: inline-flex;
            align-items: center;
            padding: 0 3.5rem;
            height: var(--stripe-height);
            border-right: 1px solid #222;
        }

        .asset-name {
            font-size: 1.1rem; 
            color: #aaa;
            margin-right: 1.25rem;
            font-weight: 700;
        }

        .price-container {
            display: flex;
            align-items: baseline;
            gap: 1rem;
        }

        .asset-price {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            transition: color 0.4s ease;
        }

        .asset-change {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
        }

        .up { color: var(--up-color); }
        .down { color: var(--down-color); }

        #status-dot {
            position: fixed;
            bottom: 5px;
            right: 5px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #333;
            z-index: 200;
        }
        .online { background: var(--up-color) !important; box-shadow: 0 0 5px var(--up-color); }
        /* Server reachable but MetaTrader 5 feed is down */
        .feed-down { background: #ffaa00 !important; box-shadow: 0 0 5px #ffaa00; }
    </style>
</head>
<body>

    <div id="time-section">
        <div id="time-label" class="time-label">UTC</div>
        <div class="time-container">
            <div id="time-display" class="time-value">00:00:00</div>
            <div id="date-display" class="date-value">-- --- ----</div>
        </div>
    </div>

    <div id="ticker-container">
        <div id="track" class="ticker-track">
            <!-- Template generator -->
            <div id="assets-original" style="display: contents;"></div>
            <div id="assets-duplicate" style="display: contents;"></div>
        </div>
    </div>

    <div id="status-dot"></div>

    <script>
        const socket = io('http://localhost:5000');
        let serverOffset = 0;
        // Symbols and their decimal places are sent by the server (see symbols.json)
        let symbolsKey = '';
        let precisions = {};

        function createAsset(sym, suffix) {
            const asset = document.createElement('div');
            asset.className = 'asset';

            const name = document.createElement('span');
            name.className = 'asset-name';
            name.textContent = sym;

            const priceContainer = document.createElement('div');
            priceContainer.className = 'price-container';

            const price = document.createElement('span');
            price.id = sym + suffix;
            price.className = 'asset-price';
            price.textContent = '---';

            const change = document.createElement('span');
            change.id = sym + '_change' + suffix;
            change.className = 'asset-change';
            change.textContent = '(0.00%)';

            priceContainer.append(price, change);
            asset.append(name, priceContainer);
            return asset;
        }

        // Build (or rebuild) the scrolling track from the server's symbol list
        function initTicker(symbolList) {
            const original = document.getElementById('assets-original');
            const duplicate = document.getElementById('assets-duplicate');
            original.replaceChildren();
            duplicate.replaceChildren();

            precisions = {};
            symbolList.forEach(({ symbol, digits }) => {
                precisions[symbol] = digits;
                original.appendChild(createAsset(symbol, ''));
                duplicate.appendChild(createAsset(symbol, '2'));
            });
        }

        socket.on('config', (config) => {
            // Only rebuild when the list actually changed (avoids a visual reset on reconnect)
            const key = JSON.stringify(config.symbols);
            if (key === symbolsKey) return;
            symbolsKey = key;
            initTicker(config.symbols);
        });

        const zones = [
            { label: 'UTC', zone: 'UTC' },
            { label: 'Istanbul', zone: 'Europe/Istanbul' },
            { label: 'Tehran', zone: 'Asia/Tehran' }
        ];
        let currentZoneIndex = 0;

        function cycleZone() {
            currentZoneIndex = (currentZoneIndex + 1) % zones.length;
            document.getElementById('time-label').innerText = zones[currentZoneIndex].label;
        }
        setInterval(cycleZone, 5000);

        function updateClock() {
            const now = new Date(Date.now() + serverOffset);
            const zone = zones[currentZoneIndex].zone;

            const timeStr = now.toLocaleTimeString('en-GB', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit', 
                timeZone: zone, 
                hour12: false 
            });
            document.getElementById('time-display').innerText = timeStr;

            let dateStr;
            try {
                const options = { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: zone };
                if (zones[currentZoneIndex].label === 'Tehran') {
                    const parts = new Intl.DateTimeFormat('en-u-ca-persian', options).formatToParts(now);
                    const y = parts.find(p => p.type === 'year').value;
                    const m = parts.find(p => p.type === 'month').value;
                    const d = parts.find(p => p.type === 'day').value;
                    dateStr = `${y}/${m}/${d}`;
                } else {
                    const parts = new Intl.DateTimeFormat('en-GB', options).formatToParts(now);
                    const y = parts.find(p => p.type === 'year').value;
                    const m = parts.find(p => p.type === 'month').value;
                    const d = parts.find(p => p.type === 'day').value;
                    dateStr = `${y}-${m}-${d}`;
                }
            } catch (e) {
                dateStr = "0000-00-00";
            }
            document.getElementById('date-display').innerText = dateStr;
        }
        setInterval(updateClock, 1000);

        // Clock correction measured by the server via NTP (0 = use the PC clock as-is)
        socket.on('time_offset', (data) => { serverOffset = data.offset_ms; });

        // Status dot: green = live, amber = server up but MT5 feed down, grey = server unreachable
        let serverConnected = false;
        let feedOnline = false;
        let feedMessage = '';
        function updateStatusDot() {
            const dot = document.getElementById('status-dot');
            dot.classList.toggle('online', serverConnected && feedOnline);
            dot.classList.toggle('feed-down', serverConnected && !feedOnline);
            dot.title = serverConnected ? feedMessage : 'Ticker server not reachable';
        }
        socket.on('connect', () => { serverConnected = true; updateStatusDot(); });
        socket.on('disconnect', () => { serverConnected = false; updateStatusDot(); });
        socket.on('feed_status', (data) => {
            feedOnline = data.online;
            feedMessage = data.message;
            updateStatusDot();
        });

        socket.on('price_update', (data) => {
            [data.symbol, data.symbol + '2'].forEach((id, idx) => {
                const el = document.getElementById(id);
                const changeEl = document.getElementById(data.symbol + '_change' + (idx === 1 ? '2' : ''));
                
                if (!el || !changeEl) return;
                
                const precision = precisions[data.symbol] ?? 2;
                const oldPrice = parseFloat(el.innerText.replace(/,/g, '')) || 0;
                const newPrice = data.price;
                
                el.innerText = newPrice.toFixed(precision);
                
                // Clear any existing timeout for this specific element to prevent flickering
                if (el.dataset.timeoutId) {
                    clearTimeout(parseInt(el.dataset.timeoutId));
                }

                // Update color for "flash" effect on price
                if (oldPrice > 0) { // Don't flash on first initialization
                    if (newPrice > oldPrice) {
                        el.className = 'asset-price up';
                    } else if (newPrice < oldPrice) {
                        el.className = 'asset-price down';
                    }
                    
                    // Set a new timeout and store its ID in the element's dataset
                    const tid = setTimeout(() => {
                        el.className = 'asset-price';
                        delete el.dataset.timeoutId;
                    }, 1500);
                    el.dataset.timeoutId = tid;
                }

                // Update percentage change
                const change = data.change;
                changeEl.innerText = '(' + (change > 0 ? '+' : '') + change.toFixed(2) + '%)';
                changeEl.className = 'asset-change ' + (change > 0 ? 'up' : change < 0 ? 'down' : '');
            });
        });
    </script>
</body>
</html>
